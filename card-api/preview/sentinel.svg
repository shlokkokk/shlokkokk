  <!-- Description -->
  <text x="28" y="76" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">AI-driven incident response and operational reliability monorepo. Groups system logs via</text>
  <text x="28" y="95" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">signature-based deduplication, indexes resolutions using conversational context mapping, queries</text>
  <text x="28" y="114" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">vector databases for historical outage postmortems, and monitors active host states including CPU</text>
  <text x="28" y="133" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">load, memory metrics, listener ports, and local container health.</text>

