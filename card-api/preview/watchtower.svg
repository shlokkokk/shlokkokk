  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Self-hostable, self-updating GitHub portfolio command center and autonomous 24/7 alert engine.</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Tracks your entire repository ecosystem dynamically via serverless REST API proxies (zero secrets in</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">bundle). Calculates 24-hour star velocity, portfolio health scores (0-100), trending spikes, and</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">dead repos. Features 14-day rolling clone &amp; traffic analytics, multi-platform launch ROI studio, and</text>

