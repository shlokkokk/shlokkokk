<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Dot pattern for tech background -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b" opacity="0.35" />
    </pattern>
    <linearGradient id="bg-Watchtower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0d0d14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-Watchtower" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark layer -->
  <rect width="800" height="200" rx="12" ry="12" fill="#090a0f"/>

  <!-- Tech dot grid background pattern -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#dot-grid)"/>

  <!-- Left accent linear gradient glow -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-Watchtower)"/>

  <!-- Tech corner brackets for absolute stunning cyber-look -->
  <path d="M 12,20 L 12,12 L 20,12" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,12 L 788,12 L 788,20" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 12,180 L 12,188 L 20,188" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,188 L 788,188 L 788,180" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>

