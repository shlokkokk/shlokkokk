  <!-- Description -->
  <text x="28" y="76" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">Interactive patient simulation and clinical grading platform. The frameworkless Node.js backend</text>
  <text x="28" y="95" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">routes through a multi-model AI waterfall &#x2014; Gemini, Groq, OpenAI, NVIDIA, Ollama &#x2014; with</text>
  <text x="28" y="114" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">scrypt-hashed credential management and optional Supabase persistence. Evaluates diagnosis</text>
  <text x="28" y="133" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">submissions against a structured rubric with keyword-mapped offline fallback dialogue and</text>

