<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Dot pattern for tech background -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b" opacity="0.35" />
    </pattern>
    <linearGradient id="bg-ZeroRisk Sentinel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0d0d14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-ZeroRisk Sentinel" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark layer -->
  <rect width="800" height="200" rx="12" ry="12" fill="#090a0f"/>

  <!-- Tech dot grid background pattern -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#dot-grid)"/>

  <!-- Left accent linear gradient glow -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-ZeroRisk Sentinel)"/>

  <!-- Tech corner brackets for absolute stunning cyber-look -->
  <path d="M 12,20 L 12,12 L 20,12" stroke="#ff4444" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,12 L 788,12 L 788,20" stroke="#ff4444" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 12,180 L 12,188 L 20,188" stroke="#ff4444" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,188 L 788,188 L 788,180" stroke="#ff4444" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" ry="12" fill="none" stroke="#ff4444" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left accent stripe with heavy blur glow -->
  <rect x="0" y="14" width="3" height="172" rx="1.5" fill="#ff4444" opacity="0.9" filter="url(#glow-ZeroRisk Sentinel)"/>

  <!-- Category metadata tag above the title -->
  <text x="51" y="22" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#ff4444" letter-spacing="1.8" opacity="0.6">// THREAT INTEL</text>

  <!-- Tech icon -->
  <g transform="translate(28, 28) scale(0.625)"><path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z" fill="#F7DF1E" opacity="0.85"/></g>

  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">ZeroRisk Sentinel</text>

  <!-- Status badge -->
  <rect x="679.5" y="23" width="92.5" height="22" rx="11" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="691.5" cy="34" r="2.8" fill="#00f0ff" filter="url(#glow-ZeroRisk Sentinel)"/>
  <text x="701.5" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.1">LIVE DEMO</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">AI-powered hybrid security platform that orchestrates real-time threat intelligence and</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">vulnerability analysis. Features a high-speed Python Flask backend that runs static binary</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">inspection, APK Android permission forensics, and signature-based YARA scanning. Integrates Llama</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">3.3 70B via Groq to translate dense forensic reports into plain-English explanations. Includes</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="80" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="68" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">JavaScript</text></g>
  <g><rect x="114" y="163" width="47" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="137.5" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">HTML5</text></g>
  <g><rect x="167" y="163" width="53.599999999999994" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="193.8" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">Python</text></g>
  <g><rect x="226.6" y="163" width="47" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="250.1" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">Flask</text></g>
  <g><rect x="279.6" y="163" width="40.4" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="299.8" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">YARA</text></g>
  <g><rect x="326" y="163" width="40.4" height="17" rx="8.5" fill="#ff4444" fill-opacity="0.08" stroke="#ff4444" stroke-width="0.5" stroke-opacity="0.35"/><text x="346.2" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="600">Groq</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#ff4444" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/ZERORISK-SENTINEL</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
</svg>