  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">MailGuard</text>

  <!-- Status badge -->
  <rect x="673" y="23" width="99" height="22" rx="11" fill="#b829dd" fill-opacity="0.12" stroke="#b829dd" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="685" cy="34" r="2.8" fill="#b829dd" filter="url(#glow-MailGuard)"/>
  <text x="695" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#b829dd" letter-spacing="1.1">PRODUCTION</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">An explainable, rule-based email forensics and threat-detection dashboard. Analyzes raw email body</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">content to calculate threat scores across multiple attack vectors: phishing links, financial scam</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">keywords, spam characteristics, and social engineering urgency cues. Built on a modular, ML-ready</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">architecture featuring locally persisted sensitivity controls and detailed visual</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="60.199999999999996" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="58.099999999999994" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">Node.js</text></g>
  <g><rect x="94.19999999999999" y="163" width="80" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="134.2" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">JavaScript</text></g>
  <g><rect x="180.2" y="163" width="47" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="203.7" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">HTML5</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/MAILGUARD-EMAIL-SECURITY</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
</svg>