<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Dot pattern for tech background -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b" opacity="0.35" />
    </pattern>
    <linearGradient id="bg-WindowFX Pro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D6" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0d0d14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-WindowFX Pro" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark layer -->
  <rect width="800" height="200" rx="12" ry="12" fill="#090a0f"/>

  <!-- Tech dot grid background pattern -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#dot-grid)"/>

  <!-- Left accent linear gradient glow -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-WindowFX Pro)"/>

  <!-- Tech corner brackets for absolute stunning cyber-look -->
  <path d="M 12,20 L 12,12 L 20,12" stroke="#0078D6" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,12 L 788,12 L 788,20" stroke="#0078D6" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 12,180 L 12,188 L 20,188" stroke="#0078D6" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,188 L 788,188 L 788,180" stroke="#0078D6" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" ry="12" fill="none" stroke="#0078D6" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left accent stripe with heavy blur glow -->
  <rect x="0" y="14" width="3" height="172" rx="1.5" fill="#0078D6" opacity="0.9" filter="url(#glow-WindowFX Pro)"/>

  <!-- Category metadata tag above the title -->
  <text x="51" y="22" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#0078D6" letter-spacing="1.8" opacity="0.6">// WIN32 SYSTEMS UTILITY</text>

  <!-- Tech icon -->
  <g transform="translate(28, 28) scale(0.625)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#0078D6" opacity="0.85"/></g>

  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">WindowFX Pro</text>

  <!-- Status badge -->
  <rect x="666.5" y="23" width="105.5" height="22" rx="11" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="678.5" cy="34" r="2.8" fill="#00ff88" filter="url(#glow-WindowFX Pro)"/>
  <text x="688.5" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#00ff88" letter-spacing="1.1">OPERATIONAL</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Ultra-lightweight Windows desktop utility (&lt;15MB RAM footprint, zero dependencies) interfacing</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">directly with Win32 APIs (WS_EX_LAYERED, WS_EX_TRANSPARENT, WS_EX_TOPMOST) for granular window</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">transparency, mouse click-through overlays, roll-up titlebar shading, borderless viewports, and DWM</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">immersive dark styling.</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="80" height="17" rx="8.5" fill="#0078D6" fill-opacity="0.08" stroke="#0078D6" stroke-width="0.5" stroke-opacity="0.35"/><text x="68" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#0078D6" letter-spacing="0.5" font-weight="600">AutoHotkey</text></g>
  <g><rect x="114" y="163" width="73.4" height="17" rx="8.5" fill="#0078D6" fill-opacity="0.08" stroke="#0078D6" stroke-width="0.5" stroke-opacity="0.35"/><text x="150.7" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#0078D6" letter-spacing="0.5" font-weight="600">Win32 API</text></g>
  <g><rect x="193.4" y="163" width="33.8" height="17" rx="8.5" fill="#0078D6" fill-opacity="0.08" stroke="#0078D6" stroke-width="0.5" stroke-opacity="0.35"/><text x="210.3" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#0078D6" letter-spacing="0.5" font-weight="600">DWM</text></g>
  <g><rect x="233.2" y="163" width="60.199999999999996" height="17" rx="8.5" fill="#0078D6" fill-opacity="0.08" stroke="#0078D6" stroke-width="0.5" stroke-opacity="0.35"/><text x="263.3" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#0078D6" letter-spacing="0.5" font-weight="600">Windows</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#0078D6" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/WINDOW-FX</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
</svg>