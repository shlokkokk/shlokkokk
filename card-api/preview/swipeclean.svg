<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Dot pattern for tech background -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b" opacity="0.35" />
    </pattern>
    <linearGradient id="bg-SwipeClean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b829dd" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0d0d14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-SwipeClean" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark layer -->
  <rect width="800" height="200" rx="12" ry="12" fill="#090a0f"/>

  <!-- Tech dot grid background pattern -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#dot-grid)"/>

  <!-- Left accent linear gradient glow -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-SwipeClean)"/>

  <!-- Tech corner brackets for absolute stunning cyber-look -->
  <path d="M 12,20 L 12,12 L 20,12" stroke="#b829dd" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,12 L 788,12 L 788,20" stroke="#b829dd" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 12,180 L 12,188 L 20,188" stroke="#b829dd" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,188 L 788,188 L 788,180" stroke="#b829dd" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" ry="12" fill="none" stroke="#b829dd" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left accent stripe with heavy blur glow -->
  <rect x="0" y="14" width="3" height="172" rx="1.5" fill="#b829dd" opacity="0.9" filter="url(#glow-SwipeClean)"/>

  <!-- Category metadata tag above the title -->
  <text x="51" y="22" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#b829dd" letter-spacing="1.8" opacity="0.6">// DESKTOP APP</text>

  <!-- Tech icon -->
  <g transform="translate(28, 28) scale(0.625)"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm-.29 2.011c.163-.006.327-.006.49 0 3.18.088 6.07 1.549 8.04 3.88L12 11.76 3.76 5.891C5.73 3.56 8.62 2.099 11.71 2.011zM2.011 12.29C2.1 9.11 3.56 6.22 5.89 4.25L11.76 12 5.891 20.24C3.56 18.27 2.099 15.38 2.011 12.29zm9.7 9.7c-3.18-.088-6.07-1.549-8.04-3.88L12 12.24l8.24 5.87C18.27 20.44 15.38 21.9 12.29 21.99c-.163.006-.327.006-.49 0h.001-.091z" fill="#47848F" opacity="0.85"/></g>

  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">SwipeClean</text>

  <!-- Status badge -->
  <rect x="699" y="23" width="73" height="22" rx="11" fill="#b829dd" fill-opacity="0.12" stroke="#b829dd" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="711" cy="34" r="2.8" fill="#b829dd" filter="url(#glow-SwipeClean)"/>
  <text x="721" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#b829dd" letter-spacing="1.1">ACTIVE</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">A gamified file management and desktop organization engine built on React 19, TypeScript, and</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Electron. Features an interactive Tinder-style card swiping UI for rapid folder triage, a real-time</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Live Stack HUD for tracking pending actions, a physics-based Safe-Undo cache to prevent accidental</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">deletions, and automated PDF/image thumbnail extraction via pdf2pic. Persists operations locally</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="66.8" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="61.4" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">Electron</text></g>
  <g><rect x="100.8" y="163" width="66.8" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="134.2" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">React 19</text></g>
  <g><rect x="173.6" y="163" width="80" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="213.6" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">TypeScript</text></g>
  <g><rect x="259.6" y="163" width="53.599999999999994" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="286.40000000000003" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">SQLite</text></g>
  <g><rect x="319.2" y="163" width="99.8" height="17" rx="8.5" fill="#b829dd" fill-opacity="0.08" stroke="#b829dd" stroke-width="0.5" stroke-opacity="0.35"/><text x="369.09999999999997" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="600">Framer Motion</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#b829dd" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/SWIPECLEAN</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
</svg>