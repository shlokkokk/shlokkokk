<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Dot pattern for tech background -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b" opacity="0.35" />
    </pattern>
    <linearGradient id="bg-CyberForge-Atlas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0d0d14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-CyberForge-Atlas" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark layer -->
  <rect width="800" height="200" rx="12" ry="12" fill="#090a0f"/>

  <!-- Tech dot grid background pattern -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#dot-grid)"/>

  <!-- Left accent linear gradient glow -->
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-CyberForge-Atlas)"/>

  <!-- Tech corner brackets for absolute stunning cyber-look -->
  <path d="M 12,20 L 12,12 L 20,12" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,12 L 788,12 L 788,20" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 12,180 L 12,188 L 20,188" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 780,188 L 788,188 L 788,180" stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" ry="12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left accent stripe with heavy blur glow -->
  <rect x="0" y="14" width="3" height="172" rx="1.5" fill="#00f0ff" opacity="0.9" filter="url(#glow-CyberForge-Atlas)"/>

  <!-- Category metadata tag above the title -->
  <text x="51" y="22" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#00f0ff" letter-spacing="1.8" opacity="0.6">// KNOWLEDGE BASE</text>

  <!-- Tech icon -->
  <g transform="translate(28, 28) scale(0.625)"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm.267 4.5l3.266 6.5H8.467l3.8-6.5zm-7.8 7.5h15l-7.5 7.5-7.5-7.5z" fill="#557C94" opacity="0.85"/></g>

  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">CyberForge-Atlas</text>

  <!-- Status badge -->
  <rect x="653.5" y="23" width="118.5" height="22" rx="11" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="665.5" cy="34" r="2.8" fill="#00f0ff" filter="url(#glow-CyberForge-Atlas)"/>
  <text x="675.5" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.1">OFFLINE AVAIL</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">A high-performance offensive intelligence matrix designed for air-gapped or restricted security</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">environments. Aggregates and indices data from popular security repositories (such as</text>
  <text x="28" y="117" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">PayloadsAllTheThings) into a lightning-fast offline search vault. Uses a custom React incremental</text>
  <text x="28" y="136" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">rendering engine to ensure 0ms latency when browsing hundreds of credential-fingerprinting commands,</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="66.8" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="61.4" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="600">Markdown</text></g>
  <g><rect x="100.8" y="163" width="33.8" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="117.69999999999999" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="600">Web</text></g>
  <g><rect x="140.6" y="163" width="80" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="180.6" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="600">JavaScript</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/CYBERFORGE-ATLAS</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
</svg>