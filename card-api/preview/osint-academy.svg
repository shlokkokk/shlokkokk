<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg-OSINT Academy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-OSINT Academy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-OSINT Academy">
      <rect width="800" height="200" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="800" height="200" rx="12" ry="12" fill="#0d0d14"/>
  <rect width="800" height="200" rx="12" ry="12" fill="url(#bg-OSINT Academy)"/>

  <!-- Border -->
  <rect width="800" height="200" rx="12" ry="12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Left accent stripe -->
  <rect x="0" y="10" width="3" height="180" rx="1.5" fill="#00f0ff" opacity="0.95" filter="url(#glow-OSINT Academy)"/>

  <!-- Tech icon -->
  

  <!-- Name -->
  <text x="28" y="41" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" letter-spacing="0.3">OSINT Academy</text>

  <!-- Status badge -->
  <rect x="666.5" y="20" width="105.5" height="22" rx="11" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.45"/>
  <circle cx="678.5" cy="31" r="2.8" fill="#00f0ff" filter="url(#glow-OSINT Academy)"/>
  <text x="688.5" y="34.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.1">EDUCATIONAL</text>

  <!-- Description -->
  <text x="28" y="76" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">Interactive OSINT learning platform with a real-time Google dork generator, comprehensive</text>
  <text x="28" y="95" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#8b9ab0" letter-spacing="0.05">reconnaissance study guides, and categorized tool references.</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e2433" stroke-width="0.75"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="47" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="51.5" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="500">HTML5</text></g>
  <g><rect x="81" y="163" width="40.4" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="101.2" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="500">CSS3</text></g>
  <g><rect x="127.4" y="163" width="80" height="17" rx="8.5" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="167.4" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#00f0ff" letter-spacing="0.5" font-weight="500">JavaScript</text></g>

  <!-- Source link -->
  <text x="772" y="175" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="10" fill="#00f0ff" letter-spacing="0.8" font-weight="600">[ SOURCE ]</text>
  <text x="772" y="191" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#374151">github.com/shlokkokk/osint-academy</text>
</svg>