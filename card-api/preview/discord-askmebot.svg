  <g transform="translate(28, 28) scale(0.625)"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.079.111 18.1.12 18.12a19.896 19.896 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#5865F2" opacity="0.85"/></g>

  <!-- Project Name -->
  <text x="51" y="44" font-family="'Segoe UI','Inter','SF Pro Display',-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">AskMeBot</text>

  <!-- Status badge -->
  <rect x="673" y="23" width="99" height="22" rx="11" fill="#ff00ff" fill-opacity="0.12" stroke="#ff00ff" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="685" cy="34" r="2.8" fill="#ff00ff" filter="url(#glow-AskMeBot)"/>
  <text x="695" y="37.5" font-family="'Segoe UI','Inter','Courier New',monospace" font-size="9" font-weight="700" fill="#ff00ff" letter-spacing="1.1">AI ENABLED</text>

  <!-- Description -->
  <text x="28" y="79" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">Smart Discord AI assistant with slash commands, memory-based conversation context, and integrated</text>
  <text x="28" y="98" font-family="'Segoe UI','Inter',-apple-system,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.05" opacity="0.9">image generation capabilities.</text>

  <!-- Divider -->
  <line x1="28" y1="154" x2="772" y2="154" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>

  <!-- Tech tags -->
  <g><rect x="28" y="163" width="53.599999999999994" height="17" rx="8.5" fill="#ff00ff" fill-opacity="0.08" stroke="#ff00ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="54.8" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff00ff" letter-spacing="0.5" font-weight="600">Python</text></g>
  <g><rect x="87.6" y="163" width="80" height="17" rx="8.5" fill="#ff00ff" fill-opacity="0.08" stroke="#ff00ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="127.6" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff00ff" letter-spacing="0.5" font-weight="600">Discord.py</text></g>
  <g><rect x="173.6" y="163" width="60.199999999999996" height="17" rx="8.5" fill="#ff00ff" fill-opacity="0.08" stroke="#ff00ff" stroke-width="0.5" stroke-opacity="0.35"/><text x="203.7" y="175" text-anchor="middle" font-family="'Segoe UI','Inter',monospace" font-size="9" fill="#ff00ff" letter-spacing="0.5" font-weight="600">AI APIs</text></g>

  <!-- Source repo name at bottom right -->
  <text x="772" y="174" text-anchor="end" font-family="'Courier New','Segoe UI',monospace" font-size="9" fill="#ff00ff" letter-spacing="0.5" font-weight="700" opacity="0.8">SHLOKKOKK/DISCORD-ASKMEBOT</text>
  <text x="772" y="190" text-anchor="end" font-family="'Segoe UI','Inter',monospace" font-size="8.5" fill="#475569">system_active // src</text>
